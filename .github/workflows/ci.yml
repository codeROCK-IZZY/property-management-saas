name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: "Python ${{ matrix.python }}: lint, types, tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (strict)
        run: mypy
      - name: Tests (Claude's second reading runs through the real SDK against canned API responses)
        run: pytest

  evaluation:
    name: Triage and dispatch on validation and fresh phrasings, and the rent ledger (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: propman evaluate --gate --out "$RUNNER_TEMP/eval"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: ${{ runner.temp }}/eval

  container:
    name: Container serves the property management console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t propman .
      - name: Health check, triage through the API, the board and a tenant ledger
        run: |
          docker run -d --name propman -p 8000:8000 propman
          for _ in $(seq 1 90); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fs -X POST -H "Content-Type: application/json" -d '{"text":"I can smell gas near the boiler"}' http://127.0.0.1:8000/api/triage | grep -q '"urgency":"emergency"'
          curl -fs http://127.0.0.1:8000/ | grep -q "Call back now"
          curl -fs http://127.0.0.1:8000/tenants/L001 | grep -q "Ledger"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --no-banner
